services:
  # Production & Demo Unified Service (Default)
  splice:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: splice-app
    ports:
      - "3001:3001"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REA_MODE=${REA_MODE:-mock}
    restart: unless-stopped

  # Development Service with Hot-Reloading (Trigger with: docker compose --profile dev up)
  splice-dev:
    profiles:
      - dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: splice-dev
    ports:
      - "3001:3001"
      - "5173:5173"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=development
      - PORT=3001
      - REA_MODE=${REA_MODE:-mock}
    volumes:
      - ./packages:/app/packages
      - ./targets:/app/targets
      # Anonymous volume prevents host directory from masking container node_modules
      - /app/node_modules
    restart: unless-stopped
