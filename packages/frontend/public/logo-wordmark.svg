<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="100%" height="100%" fill="none" role="img" aria-label="Splice">
  <defs>
    <linearGradient id="mark-amber" x1="6" y1="8" x2="30" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="mark-cyan" x1="6" y1="14" x2="30" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="mark-emerald" x1="6" y1="20" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Splice Layered Mark -->
  <g transform="translate(2, 2)">
    <!-- Bottom Layer (Emerald) -->
    <path d="M6 25L18 31.5L30 25L28 23L18 28.5L8 23L6 25Z" fill="url(#mark-emerald)" opacity="0.9"/>
    <!-- Middle Layer (Cyan) -->
    <path d="M6 19L18 25.5L30 19L28 17L18 22.5L8 17L6 19Z" fill="url(#mark-cyan)" opacity="0.95"/>
    <!-- Top Layer (Amber) -->
    <path d="M18 9L30 15.5L18 22L6 15.5L18 9Z" fill="url(#mark-amber)"/>
    <!-- Center Dot -->
    <circle cx="18" cy="15.5" r="1.75" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Wordmark Text: "SPLICE" -->
  <text x="44" y="26" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" letter-spacing="0.08em" fill="#F5F2EB">SPLICE</text>
  <text x="122" y="26" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="0.04em" fill="#A8A29E">STUDIO</text>
</svg>

